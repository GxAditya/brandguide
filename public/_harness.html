<!DOCTYPE html>
<!--
  Local render harness. Not part of the app.

  Loads real extraction output saved by scripts/demo.mjs and feeds it through the
  exact render functions the live UI uses, so a screenshot shows the real render
  path rather than a mock-up.

    node scripts/demo.mjs            # produces demo-output/
    node scripts/screenshot.mjs      # writes docs/screenshots/

  ?file=   path to a saved brand-guide.json (required)
  ?pages=N the guide length to compose
  ?page=N  open on a specific page (1-indexed)
  ?all=1   lay every page out in one long column instead of showing one at a
           time, which is what the per-page screenshot pass needs

  The run dialog is not reproduced here: it only exists while a run is live, and
  there is no run in this page.
-->
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BrandKit render harness</title>
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/deck.css">
<style>
  /* ?all=1 only. Lays the pages out as a continuous contact sheet so a single
     screenshot can show the whole deck instead of just page one. The rail and
     app bar come off so the fixed 1200px canvas gets the full window width and
     nothing is clipped. */
  body[data-all="true"] .appbar,
  body[data-all="true"] .rail,
  body[data-all="true"] .composer,
  body[data-all="true"] .foot,
  body[data-all="true"] .doc-stats { display: none; }
  body[data-all="true"] .layout { display: block; max-width: none; }
  body[data-all="true"] .stage { padding: 0; }
  body[data-all="true"] .outbox-bar { display: none; }
  /* The frame holds one page at 4:3 in the app. A contact sheet is as tall as the
     deck, so the frame has to stop being a frame here or it clips the sheet. */
  body[data-all="true"] .outbox-frame {
    aspect-ratio: auto;
    overflow: visible;
    border: 0;
    background: none;
  }
  body[data-all="true"] .deck-viewport {
    position: static;
    height: auto !important;
    overflow: visible;
    box-shadow: none;
    background: transparent;
  }
  body[data-all="true"] .deck-canvas {
    position: static;
    width: 1200px;
    height: auto;
    margin: 0 auto;
    transform: none !important;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }
  body[data-all="true"] .deck-canvas > .page,
  body[data-all="true"] .deck-canvas > .page[hidden] {
    position: relative;
    display: flex;
    flex: none;
    animation: none !important;
  }

  /*
    Printing the contact sheet. The 24px gap is a screen affordance, and on paper
    it is what pushes the last page past a sheet boundary: seven pages of 900px
    plus six gaps is 6444px, which rounds up to an eighth, entirely blank sheet.
    Closed for print, seven pages print as seven sheets.
  */
  @media print {
    body[data-all="true"] .deck-canvas { gap: 0; }
  }
</style>
</head>
<body>

<header class="appbar">
  <div class="appbar-inner">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7"/><path d="M10 9h12v4h-8v3h7v4h-7v6h-4z"/></svg>
      <span class="brand-name">BrandKit</span>
    </div>
    <div class="appbar-context" id="appbar-context" hidden>
      <span class="context-name" id="context-name"></span>
      <button type="button" class="btn-ghost" id="new-run">New run</button>
    </div>
  </div>
</header>

<main class="layout">
  <aside class="rail" aria-hidden="true"></aside>
  <section class="stage">
    <form id="composer" class="composer" hidden>
      <div class="composer-input">
        <svg class="composer-icon" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-search"/></svg>
        <input id="input" type="text" aria-label="Company name or website">
      </div>
      <button type="submit" class="btn-primary" id="run-btn">
        <span class="btn-label">Extract guide</span>
        <span class="btn-spinner" aria-hidden="true"></span>
      </button>
      <p class="field-help composer-help" id="input-help">A bare name is resolved through search.</p>
    </form>

    <!-- The output box, as the real stage has it: the toolbar above the frame,
         and the guide inside. The harness renders a saved guide through the same
         path a live run takes, so it needs the same structure. -->
    <div class="outbox" id="outbox" hidden>
      <div class="outbox-bar" id="outbox-bar"></div>

      <div class="outbox-frame">
        <canvas class="outbox-canvas" id="reveal-canvas" aria-hidden="true"></canvas>
        <div id="output" class="output"></div>
      </div>
    </div>

    <div id="alert-slot" class="toasts"></div>
  </section>
</main>

<svg class="sprite" aria-hidden="true" focusable="false">
  <symbol id="i-search" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.25" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10.2 10.2 13.5 13.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
  <symbol id="i-close" viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
  <symbol id="i-check" viewBox="0 0 16 16"><path d="M3.5 8.5l3 3 6-7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-prev" viewBox="0 0 16 16"><path d="M10 3.5L5.5 8l4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-next" viewBox="0 0 16 16"><path d="M6 3.5L10.5 8 6 12.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-download" viewBox="0 0 16 16"><path d="M8 2.5v7.5M5 7.5L8 10.5l3-3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M2.75 12.25h10.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
  <symbol id="i-alert" viewBox="0 0 16 16"><path d="M8 2.25L14.25 13.5H1.75z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M8 6.4v3.1" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="8" cy="11.3" r=".85" fill="currentColor"/></symbol>
  <symbol id="i-caret" viewBox="0 0 16 16"><path d="M4 6.5 8 10.5l4-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</svg>

<script type="module">
import { renderGuide } from '/app.js';

const params = new URLSearchParams(location.search);
const file = params.get('file');
if (!file) throw new Error('pass ?file=<path to a saved brand-guide.json>');

const guide = await fetch(file).then((r) => r.json());

const pages = Number(params.get('pages')) || guide.deck?.requestedPages || 14;
const all = params.get('all') === '1';
if (all) document.body.dataset.all = 'true';

renderGuide(guide, { target: pages });

if (!all) {
  const wanted = Number(params.get('page')) || 1;
  const next = document.querySelector('[data-deck-next]');
  for (let i = 1; i < wanted && next; i += 1) next.click();
}

document.body.dataset.ready = 'true';
</script>
</body>
</html>
